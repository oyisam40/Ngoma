<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ngoma - Verify Account</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, rgba(31,111,99,0.82), rgba(79,209,197,0.82)), url('/bg.jpg') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
        }
        .brand {
            font-family: 'Playfair Display', serif;
            color: #fff;
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 24px;
        }
        .card {
            background: #fff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        .card h1 { margin: 0 0 12px; font-size: 24px; color: #1a1a1a; }
        .card p { color: #555; margin: 0 0 20px; }
        .card a { color: #2e9385; text-decoration: none; font-weight: 700; }
        .card a:hover { text-decoration: underline; }
    </style>
</head>
<body>
<h2 class="brand">Ngoma</h2>
<div class="card">
    <h1 id="title">Verifying...</h1>
    <p id="message"></p>
    <a href="/index.html">Back to Login</a>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const status = params.get('status');

    const title = document.getElementById('title');
    const message = document.getElementById('message');

    if (status === 'success') {
        title.textContent = 'Account verified!';
        message.textContent = 'You can now log in.';
    } else if (status === 'expired') {
        title.textContent = 'Link expired';
        message.textContent = 'This verification link has expired. Please sign up again to receive a new one.';
    } else {
        title.textContent = 'Invalid link';
        message.textContent = 'This verification link is invalid or has already been used.';
    }
</script>
</body>
</html>
