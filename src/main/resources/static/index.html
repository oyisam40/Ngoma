<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ngoma - Log In</title>
    <style>
        body {font-family: san-serif; max-width: 400px; margin: 80px auto; padding: 0 20px; }
        input { display: block; width: 100%; padding: 8px; margin: 8px 0 16px; box-sizing:border-box; }
        button { padding: 10px 16px; cursor: pointer; }
        #error {color: red; display: none; margin-bottom: 12px; }
    </style>
</head>
<body>
<h1>Log in</h1>
<div id="error"></div>
<form id="loginForm">
    <label for="email">Email</label>
    <input type="email" id="email" required>

    <label for="password">Password</label>
    <input type="password" id="password" required>

    <button type="submit">Log in</button>
</form>
<p>Don't have an account? <a href="/signup.html">Sign up</a></p>
<script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('error');
        errorDiv.style.display = 'none';

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const response = await fetch('/api/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded'},
            body: new URLSearchParams({ username: email, password: password})
        });

        if (response.ok) {
            window.location.href = '/dashboard.html';
        } else {
            errorDiv.textContent = 'Invalid email or password.';
            errorDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
