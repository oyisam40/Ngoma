<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ngoma - Forgot Password</title>

    <style>
        * { box-sizing: border-box; }
        :root {
            --overlay: linear-gradient(135deg, rgba(31,111,99,0.82), rgba(79,209,197,0.82));
            --card-bg: #fff;
            --text-main: #1a1a1a;
            --text-muted: #555;
            --input-bg: #fff;
            --input-border: #ddd;
            --input-text: #1a1a1a;
        }
        html[data-theme="dark"] {
            --overlay: linear-gradient(135deg, rgba(12,43,37,0.88), rgba(17,67,57,0.88));
            --card-bg: #123f36;
            --text-main: #fff;
            --text-muted: rgba(255,255,255,0.65);
            --input-bg: #0e352d;
            --input-border: rgba(255,255,255,0.2);
            --input-text: #fff;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--overlay), url('/bg.jpg') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            transition: background 0.3s;
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.25); }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .brand {
            font-family: 'Playfair Display', serif;
            color: #fff;
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 24px;
            letter-spacing: 1px;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
            opacity: 0;
            animation: fadeInDown 0.8s ease 0.1s forwards;
        }
        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 400px;
            transition: background 0.3s;
        }
        .card h1 {
            margin: 0 0 12px;
            font-size: 24px;
            font-weight: 800;
            color: var(--text-main);
            text-align: center;
        }
        .card .subtext {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            margin: 0 0 24px;
        }
        .card input {
            display: block;
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 16px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--input-bg);
            color: var(--input-text);
        }
        .card input::placeholder { color: #999; }
        .card input:focus {
            outline: none;
            border-color: #2e9385;
        }
        .card button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #2e9385, #45c7b3);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
        }
        .card button:hover { opacity: 0.92; }
        .card p {
            text-align: center;
            margin: 20px 0 0;
            font-size: 14px;
            color: var(--text-muted);
        }
        .card a.link { color: #2e9385; text-decoration: none; font-weight: 700; }
        .card a.link:hover { text-decoration: underline; }
        #status {
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            margin-bottom: 16px;
        }
        #status.success {
            color: #166534;
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
        }
        #status.error {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
        }
    </style>
</head>
<body>
<button class="theme-toggle" id="themeToggle">🌙</button>
<h2 class="brand">Ngoma</h2>
<div class="card">
    <h1>Forgot Password</h1>
    <p class="subtext">Enter your email and we'll send you a link to reset your password.</p>
    <div id="status"></div>
    <form id="forgotForm">
        <input type="email" id="email" placeholder="Email Address" required>
        <button type="submit">Send Reset Link</button>
    </form>
    <p><a class="link" href="/index.html">Back to Login</a></p>
</div>

<script>
    const themeToggle = document.getElementById('themeToggle');
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    const savedTheme = localStorage.getItem('ngoma-theme') || 'light';
    applyTheme(savedTheme);
    themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        localStorage.setItem('ngoma-theme', next);
        applyTheme(next);
    });

    document.getElementById('forgotForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'none';

        const email = document.getElementById('email').value.trim();

        if (!email) {
            statusDiv.textContent = 'Please enter your email address.';
            statusDiv.className = 'error';
            statusDiv.style.display = 'block';
            return;
        }

        const response = await fetch('/api/forgot-password', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email })
        });

        const message = await response.text();
        statusDiv.textContent = message;
        statusDiv.className = response.ok ? 'success' : 'error';
        statusDiv.style.display = 'block';
    });
</script>
</body>
</html>
