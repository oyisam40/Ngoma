<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ngoma - Sign Up</title>
    <style>
        body { font-family: sans-serif; max-width: 400px; margin: 80px auto; padding: 0 20px; }
        input { display: block; width: 100%; padding: 8px; margin: 8px 0 16px; box-sizing: border-box; }
        button { padding: 10px 16px; cursor: pointer; }
        #error { color: red; display: none; margin-bottom: 12px }
    </style>
</head>
<body>
    <h1>Sign up</h1>
    <div id="error"></div>
    <form id="signupForm">
        <label for="email">Email</label>
        <input type="email" id="email" required>

        <label for="password">Password</label>
        <input type="password" id="password" minlength="8" required>

        <button type="submit">Sign up</button>
    </form>
    <p>Already have an account? <a href="/index.html">Log in</a></p>

    <script>
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('error');
            errorDiv.style.display = 'none';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const response = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                window.location.href = '/index.html';
            } else if (response.status === 409) {
                errorDiv.textContent = 'That email is already registered.';
                errorDiv.style.display = 'block';
            } else {
                errorDiv.textContent = 'Something went wrong. Please check your details.';
                errorDiv.style.display = 'block';
            }
        });
    </script>

</body>

</html>
