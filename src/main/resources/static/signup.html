<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ngoma - Sign Up</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        :root {
            --overlay: linear-gradient(135deg, rgba(31,111,99,0.82), rgba(79,209,197,0.82));
            --card-bg: #fff;
            --text-main: #1a1a1a;
            --text-muted: #555;
            --input-bg: #fff;
            --input-border: #ddd;
            --input-text: #1a1a1a;
            --tab-bg: #fff;
            --tab-text: #444;
        }
        html[data-theme="dark"] {
            --overlay: linear-gradient(135deg, rgba(12,43,37,0.88), rgba(17,67,57,0.88));
            --card-bg: #123f36;
            --text-main: #fff;
            --text-muted: rgba(255,255,255,0.65);
            --input-bg: #0e352d;
            --input-border: rgba(255,255,255,0.2);
            --input-text: #fff;
            --tab-bg: #0e352d;
            --tab-text: rgba(255,255,255,0.75);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--overlay), url('/bg.jpg') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin: 0;
            transition: background 0.3s;
        }
        .theme-toggle {
            position: fixed;
            top: 20px;
            right: 20px;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.4);
            background: rgba(255,255,255,0.15);
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover { background: rgba(255,255,255,0.25); }
        @keyframes fadeInDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .tagline-wrap {
            display: flex;
            align-items: center;
            gap: 14px;
            margin-bottom: 10px;
            opacity: 0;
            animation: fadeInDown 0.8s ease 0.1s forwards;
        }
        .tagline-wrap::before,
        .tagline-wrap::after {
            content: '';
            width: 40px;
            height: 1px;
            background: rgba(255, 255, 255, 0.55);
        }
        .tagline {
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 3px;
            text-transform: uppercase;
            white-space: nowrap;
        }
        .brand {
            font-family: 'Playfair Display', serif;
            color: #fff;
            font-size: 48px;
            font-weight: 900;
            margin-bottom: 24px;
            letter-spacing: 1px;
            text-shadow: 0 3px 6px rgba(0, 0, 0, 0.15);
            opacity: 0;
            animation: fadeInDown 0.8s ease 0.3s forwards;
        }
        .card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.25);
            width: 100%;
            max-width: 400px;
            transition: background 0.3s;
        }
        .card h1 {
            margin: 0 0 24px;
            font-size: 26px;
            font-weight: 800;
            color: var(--text-main);
            text-align: center;
        }
        .tabs {
            display: flex;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            color: var(--tab-text);
            background: var(--tab-bg);
        }
        .tab.active {
            background: linear-gradient(135deg, #2e9385, #45c7b3);
            color: #fff;
        }
        .card input {
            display: block;
            width: 100%;
            padding: 13px 14px;
            margin-bottom: 16px;
            border: 1px solid var(--input-border);
            border-radius: 10px;
            font-size: 14px;
            background: var(--input-bg);
            color: var(--input-text);
        }
        .card input::placeholder { color: #999; }
        .card input:focus {
            outline: none;
            border-color: #2e9385;
        }
        .card button {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, #2e9385, #45c7b3);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            margin-top: 4px;
        }
        .card button:hover { opacity: 0.92; }
        .card p {
            text-align: center;
            margin: 20px 0 0;
            font-size: 14px;
            color: var(--text-muted);
        }
        .card a.link { color: #2e9385; text-decoration: none; font-weight: 700; }
        .card a.link:hover { text-decoration: underline; }
        #error {
            color: #dc2626;
            background: #fef2f2;
            border: 1px solid #fecaca;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 13px;
            display: none;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>
<button class="theme-toggle" id="themeToggle">🌙</button>
<div class="tagline-wrap">
    <span class="tagline">Where spirituality meets technology</span>
</div>
<h2 class="brand">Ngoma</h2>
<div class="card">
    <h1>Signup Form</h1>
    <div class="tabs">
        <a class="tab" href="/index.html">Login</a>
        <span class="tab active">Signup</span>
    </div>
    <div id="error"></div>
    <form id="signupForm">
        <input type="email" id="email" placeholder="Email Address" required>
        <input type="password" id="password" placeholder="Password" minlength="8" required>
        <button type="submit">Sign up</button>
    </form>
    <p>Already a member? <a class="link" href="/index.html">Login now</a></p>
</div>

<script>
    // Theme handling
    const themeToggle = document.getElementById('themeToggle');
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    const savedTheme = localStorage.getItem('ngoma-theme') || 'light';
    applyTheme(savedTheme);
    themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        localStorage.setItem('ngoma-theme', next);
        applyTheme(next);
    });

    document.getElementById('signupForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const errorDiv = document.getElementById('error');
        errorDiv.style.display = 'none';

        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        const response = await fetch('/api/signup', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ email, password })
        });

        if (response.ok) {
            window.location.href = '/index.html';
        } else if (response.status === 409) {
            errorDiv.textContent = 'That email is already registered.';
            errorDiv.style.display = 'block';
        } else {
            errorDiv.textContent = 'Something went wrong. Please check your details.';
            errorDiv.style.display = 'block';
        }
    });
</script>
</body>
</html>
