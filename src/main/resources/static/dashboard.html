<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ngoma - Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@900&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
    <style>
        * { box-sizing: border-box; }
        :root {
            --bg1: #f4f5f7;
            --bg2: #e6f4f1;
            --card: #ffffff;
            --card-inner: #f0faf8;
            --accent: #2e9385;
            --accent2: #45c7b3;
            --green: #16a34a;
            --amber: #f59e0b;
            --text: #1a1a1a;
            --text-muted: #666;
            --grid-line: rgba(0,0,0,0.08);
            --border: #e2e2e2;
        }
        html[data-theme="dark"] {
            --bg1: #0c2b25;
            --bg2: #114339;
            --card: #123f36;
            --card-inner: #0e352d;
            --accent: #4fd1c5;
            --accent2: #2e9385;
            --green: #34d399;
            --amber: #f59e0b;
            --text: #ffffff;
            --text-muted: rgba(255,255,255,0.62);
            --grid-line: rgba(255,255,255,0.08);
            --border: rgba(255,255,255,0.15);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(160deg, var(--bg1), var(--bg2));
            min-height: 100vh;
            margin: 0;
            color: var(--text);
            padding: 24px;
            transition: background 0.3s, color 0.3s;
        }
        .theme-toggle {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 1px solid var(--border);
            background: var(--card-inner);
            color: var(--text);
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .theme-toggle:hover { opacity: 0.85; }
        .topbar {
            max-width: 1200px;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .topbar-right { display: flex; align-items: center; gap: 12px; }
        .brand {
            font-family: 'Playfair Display', serif;
            font-size: 26px;
            font-weight: 900;
        }
        .logout-btn {
            padding: 9px 18px;
            background: var(--card-inner);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
        }
        .logout-btn:hover { opacity: 0.85; }

        .dash {
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }
        .card {
            background: var(--card);
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            transition: background 0.3s;
        }
        .card-title { font-size: 15px; font-weight: 700; color: var(--text); margin: 0 0 4px; }
        .card-sub { color: var(--text-muted); font-size: 13px; margin: 0 0 18px; }

        .stat-value { font-size: 52px; font-weight: 800; line-height: 1; }
        .stat-value sup { font-size: 22px; font-weight: 700; margin-left: 4px; }
        .stat-label { color: var(--text-muted); font-size: 16px; margin: 8px 0 24px; }
        .progress-track { height: 8px; background: var(--grid-line); border-radius: 4px; overflow: hidden; }
        .progress-fill { height: 100%; width: 78%; background: var(--green); border-radius: 4px; }
        .progress-labels { display: flex; justify-content: space-between; margin-top: 8px; font-size: 13px; }
        .progress-labels .pct { color: var(--green); font-weight: 700; }
        .progress-labels .goal { color: var(--text-muted); }

        .chart-row { display: flex; gap: 32px; }
        .chart-col { flex: 1.4; }
        .gauge-col { flex: 1; text-align: center; }
        canvas { max-width: 100%; }

        .gauge-wrap { position: relative; width: 200px; height: 100px; margin: 0 auto 14px; overflow: hidden; }
        .gauge-arc {
            width: 200px; height: 200px; border-radius: 50%;
            background: conic-gradient(from -90deg, var(--grid-line) 0deg 126deg, var(--green) 126deg 180deg);
        }
        .gauge-tick { position: absolute; top: 8px; left: 148px; width: 2px; height: 22px; background: var(--amber); transform: rotate(20deg); transform-origin: bottom center; }
        .gauge-needle { position: absolute; bottom: 0; left: 98px; width: 3px; height: 88px; background: var(--text); border-radius: 2px; transform: rotate(28deg); transform-origin: bottom center; }
        .gauge-hub { position: absolute; bottom: -8px; left: 88px; width: 20px; height: 20px; border-radius: 50%; background: var(--text); }
        .gauge-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--text-muted); margin-top: -4px; }
        .gauge-value { font-size: 34px; font-weight: 800; margin-top: 10px; }

        .activity-card { grid-column: 1 / -1; }
        .activity-grid { display: flex; gap: 28px; margin-top: 18px; }
        .activity-number {
            flex: 0 0 220px;
            background: var(--card-inner);
            border: 1px solid var(--accent2);
            border-radius: 12px;
            padding: 24px;
            position: relative;
        }
        .activity-number .big { font-size: 48px; font-weight: 800; }
        .activity-number .lbl { color: var(--text-muted); font-size: 15px; margin-top: 6px; }
        .check-badge {
            position: absolute; bottom: 16px; right: 16px;
            width: 34px; height: 34px; border-radius: 50%;
            background: var(--green);
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; font-weight: 800; color: #063a2c;
        }
        .activity-chart { flex: 1; }
        .activity-chart h3 { font-size: 14px; margin: 0 0 12px; color: var(--text); }

        footer {
            max-width: 1200px;
            margin: 20px auto 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: var(--text-muted);
            font-size: 13px;
        }
        footer .foot-left { display: flex; align-items: center; gap: 8px; }
        footer .foot-left .dot { width: 22px; height: 22px; border-radius: 6px; background: var(--accent2); }
        #clock { font-variant-numeric: tabular-nums; }

        @media (max-width: 860px) {
            .dash { grid-template-columns: 1fr; }
            .chart-row { flex-direction: column; }
            .activity-grid { flex-direction: column; }
            .activity-number { flex: none; }
        }
    </style>
</head>
<body>
<div class="topbar">
    <div class="brand">Ngoma</div>
    <div class="topbar-right">
        <button class="theme-toggle" id="themeToggle">🌙</button>
        <button class="logout-btn" id="logoutBtn">Log out</button>
    </div>
</div>

<div class="dash">
    <div class="card">
        <div class="stat-value">1,204<sup>members</sup></div>
        <div class="stat-label">Total members this month</div>
        <div class="progress-track"><div class="progress-fill"></div></div>
        <div class="progress-labels">
            <span class="pct">120%</span>
            <span class="goal">Goal: 1,000</span>
        </div>
    </div>

    <div class="card">
        <div class="chart-row">
            <div class="chart-col">
                <div class="card-title">New sign-ups</div>
                <div class="card-sub">Past 30 days</div>
                <canvas id="lineChart" height="140"></canvas>
            </div>
            <div class="gauge-col">
                <div class="card-title">This week</div>
                <div class="card-sub">Avg. daily sign-ups</div>
                <div class="gauge-wrap">
                    <div class="gauge-arc"></div>
                    <div class="gauge-tick"></div>
                    <div class="gauge-needle"></div>
                    <div class="gauge-hub"></div>
                </div>
                <div class="gauge-scale"><span>0</span><span>100</span></div>
                <div class="gauge-value">62</div>
            </div>
        </div>
    </div>

    <div class="card activity-card">
        <div class="card-title">Sign-ups today</div>
        <div class="activity-grid">
            <div class="activity-number">
                <div class="big">18</div>
                <div class="lbl">...so far</div>
                <div class="check-badge">&#10003;</div>
            </div>
            <div class="activity-chart">
                <h3>By status</h3>
                <canvas id="statusChart" height="110"></canvas>
            </div>
            <div class="activity-chart">
                <h3>Sign-ups per hour</h3>
                <canvas id="hourChart" height="110"></canvas>
            </div>
        </div>
    </div>
</div>

<footer>
    <div class="foot-left">
        <span class="dot"></span>
        <span>Ngoma dashboard</span>
    </div>
    <span id="clock"></span>
</footer>

<script>
    // Theme handling
    const themeToggle = document.getElementById('themeToggle');
    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        themeToggle.textContent = theme === 'dark' ? '☀️' : '🌙';
    }
    const savedTheme = localStorage.getItem('ngoma-theme') || 'light';
    applyTheme(savedTheme);
    themeToggle.addEventListener('click', () => {
        const current = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
        const next = current === 'dark' ? 'light' : 'dark';
        localStorage.setItem('ngoma-theme', next);
        applyTheme(next);
    });

    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = '/index.html';
    });

    function updateClock() {
        const now = new Date();
        const h = String(now.getHours()).padStart(2, '0');
        const m = String(now.getMinutes()).padStart(2, '0');
        document.getElementById('clock').textContent = h + ':' + m;
    }
    updateClock();
    setInterval(updateClock, 1000 * 30);

    Chart.defaults.color = getComputedStyle(document.documentElement).getPropertyValue('--text-muted');
    Chart.defaults.font.family = "-apple-system, 'Segoe UI', Roboto, sans-serif";
    const gridColor = getComputedStyle(document.documentElement).getPropertyValue('--grid-line');

    new Chart(document.getElementById('lineChart'), {
        type: 'line',
        data: {
            labels: ['1', '5', '10', '15', '20', '25', '30'],
            datasets: [{
                data: [12, 14, 13, 40, 44, 41, 46],
                borderColor: '#4fd1c5',
                backgroundColor: 'rgba(79,209,197,0.15)',
                fill: true,
                tension: 0.35,
                pointRadius: 0,
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { color: gridColor } },
                y: { grid: { color: gridColor }, beginAtZero: true }
            }
        }
    });

    new Chart(document.getElementById('statusChart'), {
        type: 'bar',
        data: {
            labels: ['verified', 'pending', 'rejected'],
            datasets: [{
                data: [82, 196, 74],
                backgroundColor: '#2e9385',
                borderRadius: 4,
                maxBarThickness: 44
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { display: false } },
                y: { grid: { color: gridColor }, beginAtZero: true }
            }
        }
    });

    new Chart(document.getElementById('hourChart'), {
        type: 'bar',
        data: {
            labels: ['00:00', '03:00', '06:00', '09:00', '12:00', '15:00', '18:00', '21:00'],
            datasets: [{
                data: [6, 5, 7, 4, 6, 2, 3, 5],
                backgroundColor: ['#16a34a','#2e9385','#16a34a','#2e9385','#16a34a','#2e9385','#16a34a','#2e9385'],
                borderRadius: 4,
                maxBarThickness: 30
            }]
        },
        options: {
            responsive: true,
            plugins: { legend: { display: false } },
            scales: {
                x: { grid: { display: false } },
                y: { grid: { color: gridColor }, beginAtZero: true }
            }
        }
    });
</script>
</body>
</html>
