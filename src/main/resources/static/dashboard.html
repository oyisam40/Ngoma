<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ngoma — Dashboard</title>
    <style>
        * { box-sizing: border-box; }
     body {
         font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
         background: linear-gradient(135deg, #1f6f63, #4fd1c5);
         min-height: 100vh;
         display: flex;
         align-items: center;
         justify-content: center;
         margin: 0;
     }
     .card {
         background: #fff;
         padding: 40px;
         border-radius: 16px;
         box-shadow: 0 20px 50px rgba(0,0,0,0.25);
         width: 100%;
         max-width: 400px;
         text-align: center;
     }
     .card h1 {
         margin: 0 0 8px;
         font-size: 26px;
         font-weight: 800;
         color: #1a1a1a;
     }
     .card p {
         color: #666;
         margin: 0 0 24px;
     }
     .card button {
         padding: 12px 28px;
         background: linear-gradient(135deg, #2e9385, #45c7b3);
         color: #fff;
         border: none;
         border-radius: 10px;
         font-size: 14px;
         font-weight: 700;
         cursor: pointer;
     }
     .card button:hover { opacity: 0.92; }
    </style>
</head>
<body>
<div class="card">
    <h1>Welcome</h1>
    <p>You're logged in.</p>
    <button id="logoutBtn">Log out</button>
</div>

<script>
    document.getElementById('logoutBtn').addEventListener('click', async () => {
        await fetch('/api/logout', { method: 'POST' });
        window.location.href = '/index.html';
    });
</script>
</body>
</html>
